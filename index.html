<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VirtualFit: Spatial Try-On</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
:root{
  --ease:cubic-bezier(.2,.8,.2,1);
  --sans:"Inter",system-ui,-apple-system,sans-serif;
  --MH:min(78vh,62vw);
  --CW:200px;
  --room:url("https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261104_080623_c94c85a3-23d5-4a0c-afff-41be1b5b8191.png&w=2400&q=85");
  --model:url("https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261104_080717_e02cb856-b812-4c9b-9b86-8a741c7f65eb.png&w=2688&q=85");
  --garm:url("https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261104_080719_f5a4cca2-cf42-4957-ab3b-ddec34d2b71a.png&w=2048&q=85");
}
body{background:#e9e4dc;color:#fff;font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:none}
@media (pointer:fine){html,body,button,a,input{cursor:none}}
input{font:inherit;color:inherit;user-select:text;-webkit-user-select:text}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* room */
.room{position:fixed;inset:-3%;background:var(--room) center/cover no-repeat;filter:blur(2.5px) saturate(1.05);transform:scale(1.08)}
.room::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 60% at 50% 45%,rgba(255,252,246,.10),rgba(40,30,20,.16))}

/* ghost word */
.ghost{position:fixed;left:50%;top:calc(50% - var(--MH)*.42);transform:translate(-50%,0);z-index:2;pointer-events:none;white-space:nowrap;
  font-weight:900;font-size:calc(var(--MH)*.42);line-height:.8;letter-spacing:-.04em;
  color:rgba(255,255,255,.3);-webkit-text-stroke:1px rgba(255,255,255,.35);text-shadow:0 1px 0 rgba(255,255,255,.35)}
.ghost span{display:inline-block}

/* glass */
.glass{background:linear-gradient(155deg,rgba(250,248,245,.30),rgba(150,144,136,.20) 48%,rgba(205,200,192,.24));
  backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);
  border:1px solid rgba(255,255,255,.5);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -1px 0 rgba(255,255,255,.12),0 20px 50px -24px rgba(40,30,20,.45)}

/* tabs */
.tabs{position:fixed;left:50%;transform:translateX(-50%);top:4.2vh;z-index:30;display:flex;gap:2px;padding:5px;border-radius:999px}
.tabs .pill{position:absolute;left:0;top:5px;height:38px;width:0;border-radius:999px;background:rgba(255,255,255,.92);box-shadow:0 4px 14px -6px rgba(0,0,0,.3);transition:transform .6s var(--ease),width .6s var(--ease)}
.tabs button{position:relative;z-index:1;height:38px;padding:0 22px;border-radius:999px;font-weight:500;font-size:14px;color:rgba(30,30,32,.72);white-space:nowrap;transition:color .3s}
.tabs button.on{color:#111}

/* rail */
.rail{position:fixed;left:max(18px,1.8vw);top:50%;transform:translateY(-50%);z-index:30;display:flex;flex-direction:column;gap:10px;padding:8px;border-radius:999px}
.rail button{position:relative;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:rgba(30,30,32,.8);transition:background .3s,color .3s}
.rail button:hover{background:rgba(255,255,255,.35)}
.rail button.on{background:rgba(255,255,255,.9);color:#111}
.rail svg{width:20px;height:20px}

/* stage + cards */
.stage{position:fixed;inset:0;z-index:10;touch-action:pan-y}
.arc{position:absolute;left:50%;top:50%;width:0;height:0}
.card{position:absolute;left:calc(var(--CW)/-2);top:calc(var(--CW)*-.71);width:var(--CW);height:calc(var(--CW)*1.42);border-radius:22px;overflow:hidden;will-change:transform,opacity}
.card .g{position:absolute;left:8%;right:8%;top:5%;height:66%;display:flex;justify-content:center;filter:drop-shadow(0 14px 14px rgba(40,30,20,.22))}
.gi{flex:none;height:100%;aspect-ratio:1;background-image:var(--garm);background-repeat:no-repeat;background-size:320% 212.5%}
.card .nm{position:absolute;left:0;right:0;bottom:17%;text-align:center;font-weight:500;font-size:calc(var(--CW)*.068);text-shadow:0 1px 8px rgba(0,0,0,.18)}
.card .pr{position:absolute;left:0;right:0;bottom:7%;text-align:center;font-weight:700;font-size:calc(var(--CW)*.095);text-shadow:0 1px 8px rgba(0,0,0,.18)}
.sheen{position:absolute;inset:0;pointer-events:none;transform:translateX(-120%);background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.5) 50%,transparent 60%)}
.card:hover .sheen{animation:sheen 1s}
@keyframes sheen{to{transform:translateX(120%)}}

/* model */
.model{position:fixed;left:50%;bottom:0;transform:translateX(-50%);height:var(--MH);aspect-ratio:524/1360;z-index:50;pointer-events:none}
.fig{position:absolute;inset:0;background-image:var(--model);background-repeat:no-repeat;background-size:513% 111.76%;background-position-y:100%;transform-origin:50% 100%}
#mCur{opacity:0}
#mNext{clip-path:inset(0 0 100% 0)}
.grid{position:absolute;inset:0;clip-path:inset(0 0 100% 0);mix-blend-mode:screen;
  background:repeating-linear-gradient(0deg,transparent 0 5px,rgba(255,255,255,.22) 5px 6px);
  -webkit-mask-image:var(--model);mask-image:var(--model);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-size:513% 111.76%;mask-size:513% 111.76%;-webkit-mask-position-y:100%;mask-position-y:100%}
.scan{position:absolute;left:-14%;right:-14%;top:0;height:2px;opacity:0;
  background:linear-gradient(90deg,transparent,#fff 18%,#fff 82%,transparent);
  box-shadow:0 0 18px 4px rgba(255,255,255,.75),0 0 60px 10px rgba(190,225,255,.45)}
.scan::after{content:"";position:absolute;left:0;right:0;bottom:100%;height:calc(var(--MH)*.12);background:linear-gradient(to top,rgba(220,238,255,.32),transparent)}

/* arrows */
.arrow{position:fixed;top:50%;transform:translateY(-50%);z-index:30;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#222}
.arrow svg{width:16px;height:16px}
.arrow.l{left:calc(max(18px,1.8vw) + 76px)}
.arrow.r{right:max(18px,1.8vw)}

/* whatsapp */
.wa{position:fixed;right:max(18px,1.8vw);top:calc(50% + 40px);z-index:30;display:flex;align-items:center;gap:10px;height:46px;padding:0 18px 0 12px;border-radius:999px;text-decoration:none;color:#111;font-weight:600;font-size:13px;letter-spacing:.01em;transition:background .3s}
.wa:hover{background:rgba(255,255,255,.35)}
.wa svg{width:24px;height:24px;color:#25D366;flex:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.2))}

/* rail badge */
.badge{position:absolute;top:1px;right:1px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:#fff;color:#111;font-style:normal;font-weight:700;font-size:10px;line-height:17px;text-align:center;box-shadow:0 2px 8px -2px rgba(0,0,0,.35);transform:scale(0);transition:transform .35s var(--ease);pointer-events:none}
.badge.show{transform:scale(1)}

/* side panels */
.panel{position:fixed;left:calc(max(18px,1.8vw) + 76px);top:50%;width:min(340px,100vw - 120px);max-height:62vh;overflow-y:auto;scrollbar-width:none;z-index:40;border-radius:24px;padding:18px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.18);
  opacity:0;pointer-events:none;transform:translateY(-50%) translateX(-14px) scale(.97);transition:opacity .45s var(--ease),transform .55s var(--ease)}
.panel.open{opacity:1;pointer-events:auto;transform:translateY(-50%)}
.panel::-webkit-scrollbar{display:none}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.pt{font-weight:700;font-size:18px}
.ps{font-weight:500;font-size:12px;opacity:.85;margin-top:2px}
.ps.ok{margin-top:10px;text-align:center;min-height:1.2em}
.lab2{font-weight:500;font-size:12px;opacity:.85;margin:12px 0 8px}
.empty{font-weight:500;font-size:14px;line-height:1.5;opacity:.9;padding:18px 0 8px;text-align:center}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:8px;border-radius:16px;background:rgba(255,255,255,.18)}
.row .th{width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.3);padding:4px}
.row .th .gi{width:100%;height:100%;aspect-ratio:auto}
.rm b{display:block;font-weight:600;font-size:14px}
.rm span{display:block;font-weight:500;font-size:12px;opacity:.85;margin:1px 0 6px}
.qt{display:flex;align-items:center;gap:8px}
.qt em{font-style:normal;font-weight:600;font-size:13px;min-width:14px;text-align:center}
.q{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-weight:600;font-size:14px;line-height:1;transition:transform .25s var(--ease),background .3s}
.q:hover{background:rgba(255,255,255,.4)}
.q:active{transform:scale(.9)}
.rp{font-weight:700;font-size:14px;align-self:start;padding-top:2px}
.tot{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 12px;font-weight:600;font-size:15px}
.tot b{font-weight:800;font-size:18px}
.pbtn{width:100%;height:44px;border-radius:999px;background:#fff;color:#111;font-weight:600;font-size:14px;text-shadow:none;box-shadow:0 4px 14px -6px rgba(0,0,0,.3);margin-top:16px;transition:transform .25s var(--ease),opacity .3s}
.tot+.pbtn{margin-top:0}
.pbtn:hover{opacity:.92}
.pbtn:active{transform:scale(.97)}
.drow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.drow::-webkit-scrollbar{display:none}
.dch{flex:none;width:50px;height:60px;border-radius:16px;background:rgba(255,255,255,.22);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:background .3s,color .3s,transform .25s var(--ease)}
.dch span{font-weight:500;font-size:11px;opacity:.9}
.dch b{font-weight:700;font-size:17px}
.dch.on{background:#fff;color:#111;text-shadow:none}
.trow{display:flex;flex-wrap:wrap;gap:8px}
.tch{height:34px;padding:0 15px;border-radius:999px;background:rgba(255,255,255,.22);font-weight:600;font-size:13px;transition:background .3s,color .3s,transform .25s var(--ease)}
.tch.on{background:#fff;color:#111;text-shadow:none}
.dch:active,.tch:active{transform:scale(.95)}
.avatar{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.5);display:grid;place-items:center;font-weight:700;font-size:22px;margin:4px 0 14px}
.avatar svg{width:26px;height:26px}
.panel input{width:100%;height:44px;border-radius:14px;padding:0 14px;margin-bottom:10px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.5);color:#fff;font-weight:500;font-size:14px;outline:none;text-shadow:0 1px 6px rgba(0,0,0,.18);transition:border-color .3s,background .3s}
.panel input::placeholder{color:rgba(255,255,255,.75)}
.panel input:focus{border-color:#fff;background:rgba(255,255,255,.3)}

/* buy card */
.buy{position:fixed;left:50%;transform:translateX(-50%);bottom:4.6vh;z-index:60;width:min(640px,100vw - 32px);display:flex;align-items:center;gap:22px;padding:12px 22px 12px 12px;border-radius:24px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.18)}
.thumb{flex:none;width:64px;height:64px;border-radius:14px;background:rgba(255,255,255,.3);padding:6px;overflow:hidden}
.thumb .gi{width:100%;height:100%;aspect-ratio:auto}
.info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ln{display:grid;height:1.15em;line-height:1.15;overflow:hidden}
.ln>span{grid-area:1/1;white-space:nowrap}
.nmL{font-weight:600;font-size:16px}
.prL{font-weight:500;font-size:14px;opacity:.9}
.grp{display:flex;flex-direction:column;gap:7px}
.lab{font-weight:500;font-size:12px;opacity:.85}
.chips,.dots{display:flex;gap:6px;align-items:center}
.chip{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.22);color:#fff;font-weight:600;font-size:12px;display:grid;place-items:center;transition:transform .25s var(--ease),background .3s,color .3s}
.chip:active{transform:scale(.9)}
.chip.on{background:#fff;color:#111;text-shadow:none}
.dots{gap:8px;height:30px}
.dot{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.1);transition:box-shadow .3s}
.dot.on{box-shadow:0 0 0 2px rgba(255,255,255,.95),0 0 0 4px rgba(0,0,0,.12)}
.grp .ln.lab{height:1.15em}

/* add to cart */
.add{flex:none;width:44px;height:44px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;text-shadow:none;box-shadow:0 4px 14px -6px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
.add svg{width:18px;height:18px}
.add:active{transform:scale(.9)}

/* cursor */
.cur{display:none;position:fixed;left:-29px;top:-29px;width:58px;height:58px;z-index:100;pointer-events:none;opacity:0;transition:opacity .3s}
.cur.show{opacity:1}
@media (pointer:fine){.cur{display:block}}
.cur .ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(255,255,255,.95);background:rgba(255,255,255,.14);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 6px 20px -8px rgba(0,0,0,.35);
  transition:transform .5s var(--ease),background .5s var(--ease)}
.cur .dt{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff;transition:transform .4s var(--ease),opacity .4s var(--ease)}
.cur .lb{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:10px;letter-spacing:.12em;opacity:0;transform:scale(.6);transition:transform .45s var(--ease),opacity .45s var(--ease);white-space:nowrap}
.cur .lb.t{color:#111}
.cur .lb.d{color:#fff}
.cur.down .ring{transform:scale(1.05)}
.cur.drag .ring{transform:scale(1.2)}
.cur.drag .lb.d{opacity:1;transform:scale(1)}
.cur.drag .dt,.cur.try .dt{opacity:0;transform:scale(0)}
.cur.try .ring{transform:scale(1.5);background:rgba(255,255,255,.92)}
.cur.try .lb.t{opacity:1;transform:scale(1)}
.cur.try .lb.d{opacity:0}
.cur.btn .ring{transform:scale(.6)}

@media (max-width:767px){
  :root{--MH:min(62vh,128vw)}
  .tabs{max-width:calc(100vw - 20px);overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{height:32px;padding:0 13px;font-size:12px}
  .tabs .pill{height:32px}
  .rail{top:auto;transform:none;left:10px;bottom:calc(4.6vh + 150px)}
  .rail button{width:34px;height:34px}
  .arrow{display:none}
  .wa{top:auto;right:10px;bottom:calc(4.6vh + 150px);width:44px;height:44px;padding:0;justify-content:center}
  .wa span{display:none}
  .panel{top:auto;left:70px;right:10px;width:auto;bottom:calc(4.6vh + 150px);max-height:44vh;transform:translateY(14px) scale(.97)}
  .panel.open{transform:none}
  .buy{flex-wrap:wrap;gap:12px 16px;padding:12px}
  .info{flex:1 1 calc(100% - 90px)}
  .grp{flex:1 1 auto}
}
@media (prefers-reduced-motion:reduce){
  .card:hover .sheen{animation:none}
  .tabs .pill{transition:none}
}
</style>
</head>
<body>

<div class="room" id="room"></div>
<div class="ghost" id="ghost"><span>F</span><span>A</span><span>H</span><span>D</span></div>

<nav class="tabs glass" id="tabs">
  <i class="pill" id="pill"></i>
  <button class="on">Tops</button><button>Bottoms</button><button>Outerwear</button><button>Shoes</button><button>Accessories</button>
</nav>

<aside class="rail glass">
  <button class="on" data-p="tops" aria-label="Tops"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.5 3 3 6l1.8 4.2L7 9.3V21h10V9.3l2.2.9L21 6l-5.5-3a3.6 3.6 0 0 1-7 0z"/></svg></button>
  <button data-p="cart" aria-label="Cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.5l2 11h10l2-8H6.5"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg><i class="badge" id="badge"></i></button>
  <button data-p="cal" aria-label="Calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></button>
  <button data-p="me" aria-label="Profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.2-3.6 4.2-5.5 7.5-5.5s6.3 1.9 7.5 5.5"/></svg></button>
</aside>

<div class="panel glass" id="panel" aria-live="polite"></div>

<div class="stage" id="stage"><div class="arc" id="arc"></div></div>

<div class="model" id="model">
  <div class="fig" id="mCur"></div>
  <div class="fig" id="mNext"></div>
  <div class="grid" id="grid"></div>
  <div class="scan" id="scan"></div>
</div>

<button class="arrow l glass" id="prev" aria-label="Previous"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg></button>
<button class="arrow r glass" id="next" aria-label="Next"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg></button>

<a class="wa glass" id="wa" href="https://wa.me/201115122652" target="_blank" rel="noopener" aria-label="WhatsApp">
  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
  <span>01115122652</span>
</a>

<section class="buy glass" id="buy">
  <div class="thumb"><div class="gi" id="thumbG"></div></div>
  <div class="info">
    <div class="ln nmL" id="lnName"><span></span></div>
    <div class="ln prL" id="lnPrice"><span></span></div>
  </div>
  <div class="grp">
    <div class="lab">Size</div>
    <div class="chips" id="chips"><button class="chip">S</button><button class="chip on">M</button><button class="chip">L</button><button class="chip">XL</button></div>
  </div>
  <div class="grp">
    <div class="ln lab" id="lnColor"><span></span></div>
    <div class="dots" id="dots"></div>
  </div>
  <button class="add" id="add" aria-label="Add to cart"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 3v12M3 9h12"/></svg></button>
</section>

<div class="cur" id="cur"><div class="ring"></div><div class="dt"></div><div class="lb t">TRY ON</div><div class="lb d">DRAG</div></div>

<script>
(function(){
"use strict";
const EASE="cubic-bezier(.2,.8,.2,1)";
const ITEMS=[
  {n:"Basic T-shirt", p:45,  g:[1.14,3.06],  m:.37,   c:[["White","#f4f2ee"],["Ash","#c9c7c2"],["Charcoal","#3b3c3f"],["Navy","#27324d"]]},
  {n:"Basic Sweater", p:105, g:[49.7,1.39],  m:25.0,  c:[["White","#f6f4ef"],["Oat","#ddd3c2"],["Sage","#b9c2ae"],["Black","#1f1f21"]]},
  {n:"Linen Shirt",   p:95,  g:[98.2,3.33],  m:49.86, c:[["White","#f7f6f1"],["Sand","#d9ccb4"],["Sky","#bcd0e2"],["Olive","#717556"]]},
  {n:"Grey Hoodie",   p:110, g:[1.14,93.3],  m:74.77, c:[["Heather","#a9a9a8"],["Bone","#e6e1d6"],["Forest","#33463a"],["Black","#1f1f21"]]},
  {n:"Ringer Tee",    p:55,  g:[49.7,95.3],  m:99.35, c:[["White / Black","#f4f2ee"],["Cream / Navy","#efe6d3"],["Grey / Red","#c9c7c2"],["White / Green","#e9efe8"]]}
];
const N=10;
const $=id=>document.getElementById(id);
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
const mod=(a,n)=>((a%n)+n)%n;

const root=document.documentElement;
const stage=$("stage"),arc=$("arc"),room=$("room"),ghost=$("ghost");
const mCur=$("mCur"),mNext=$("mNext"),grid=$("grid"),scan=$("scan");
const ghostLetters=[...ghost.children];

let W=innerWidth,H=innerHeight;
function isPhone(){return W<768}
function XS(){return isPhone()?[0,.36,.5,.56,.6,.62]:[0,.215,.345,.432,.49,.52]}
function xAt(a){
  const t=XS();a=Math.min(a,5);
  const k=Math.min(4,Math.floor(a)),f=a-k;
  return (t[k]+(t[k+1]-t[k])*f)*W;
}
function sizeUp(){
  W=innerWidth;H=innerHeight;
  const cw=isPhone()?Math.min(W*.30,170):Math.min(W*.148,H*.33);
  root.style.setProperty("--CW",cw+"px");
  placePill(false);
}

/* ---------- cards ---------- */
const cards=[];
for(let i=0;i<N;i++){
  const it=ITEMS[i%5];
  const el=document.createElement("div");
  el.className="card glass";
  el.dataset.i=i;
  el.innerHTML='<div class="g"><div class="gi" style="background-position:'+it.g[0]+'% '+it.g[1]+'%"></div></div>'+
    '<div class="nm">'+it.n+'</div><div class="pr">$'+it.p+'</div><div class="sheen"></div>';
  arc.appendChild(el);
  cards.push({el,seed:i*1.7});
}

/* ---------- tabs ---------- */
const tabs=$("tabs"),pill=$("pill");
function placePill(anim){
  const b=tabs.querySelector("button.on");
  if(!b)return;
  if(anim===false){pill.style.transition="none"}
  pill.style.width=b.offsetWidth+"px";
  pill.style.transform="translateX("+b.offsetLeft+"px)";
  if(anim===false){void pill.offsetWidth;pill.style.transition=""}
}
tabs.addEventListener("click",e=>{
  const b=e.target.closest("button");
  if(!b)return;
  tabs.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
  placePill(true);
  target+=5;
});

/* ---------- buy card ---------- */
const lnName=$("lnName"),lnPrice=$("lnPrice"),lnColor=$("lnColor"),dots=$("dots"),thumbG=$("thumbG");
function roll(el,text,animate){
  const last=el.lastElementChild;
  if(last&&last.textContent===text)return;
  const n=document.createElement("span");
  n.textContent=text;
  el.appendChild(n);
  const olds=[...el.children].filter(s=>s!==n);
  if(!animate||reduced){olds.forEach(s=>s.remove());return}
  const o={duration:620,easing:EASE,fill:"both"};
  n.animate([{transform:"translateY(110%)"},{transform:"translateY(0)"}],o);
  olds.forEach(s=>{s.animate([{transform:"translateY(0)"},{transform:"translateY(-110%)"}],o).onfinish=()=>s.remove()});
}
let selColor=0;
function setBuy(idx,animate){
  const it=ITEMS[idx];
  roll(lnName,it.n,animate);
  roll(lnPrice,"$"+it.p,animate);
  roll(lnColor,"Color · "+it.c[0][0],animate);
  thumbG.style.backgroundPosition=it.g[0]+"% "+it.g[1]+"%";
  if(animate&&!reduced)thumbG.animate([{transform:"translateY(70%) scale(.8)"},{transform:"none"}],{duration:650,easing:EASE});
  selColor=0;dots.innerHTML="";
  it.c.forEach((c,k)=>{
    const d=document.createElement("button");
    d.className="dot"+(k===0?" on":"");
    d.style.background=c[1];
    d.setAttribute("aria-label",c[0]);
    d.addEventListener("click",()=>{
      selColor=k;
      dots.querySelectorAll(".dot").forEach(x=>x.classList.toggle("on",x===d));
      roll(lnColor,"Color · "+c[0],true);
    });
    dots.appendChild(d);
  });
}
$("chips").addEventListener("click",e=>{
  const b=e.target.closest(".chip");
  if(!b)return;
  $("chips").querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===b));
});

/* ---------- side panels (rail) ---------- */
const panel=$("panel"),badge=$("badge"),railEl=document.querySelector(".rail");
const railBtns=[...railEl.querySelectorAll("button")];
const WA="201115122652";
const TIMES=["11:00","13:00","15:00","17:00","19:00"];
const PLUS='<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 3v12M3 9h12"/></svg>';
const CHECK='<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 9.5l3.5 3.5 7.5-8"/></svg>';
const XICON='<svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3l10 10M13 3 3 13"/></svg>';
const USER='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.2-3.6 4.2-5.5 7.5-5.5s6.3 1.9 7.5 5.5"/></svg>';
let cart=[],profile={name:"",phone:"",size:"M"},openName=null;
const book={d:0,t:"15:00"};
try{
  cart=JSON.parse(localStorage.getItem("vf_cart")||"[]");
  Object.assign(profile,JSON.parse(localStorage.getItem("vf_profile")||"{}"));
}catch(e){}
function persist(){try{localStorage.setItem("vf_cart",JSON.stringify(cart));localStorage.setItem("vf_profile",JSON.stringify(profile))}catch(e){}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function openWA(text){window.open("https://wa.me/"+WA+"?text="+encodeURIComponent(text),"_blank","noopener")}
function applyProfileSize(){$("chips").querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x.textContent===profile.size))}
function readProfileInputs(){const n=$("pName");if(n){profile.name=n.value.trim();profile.phone=$("pPhone").value.trim()}}
function cartCount(){return cart.reduce((s,i)=>s+i.q,0)}
function updateBadge(bump){
  const c=cartCount();
  badge.textContent=c;
  badge.classList.toggle("show",c>0);
  if(bump&&!reduced&&c>0)badge.animate([{transform:"scale(1.6)"},{transform:"scale(1)"}],{duration:420,easing:EASE});
}
function head(title,sub){
  return '<div class="ph"><div><div class="pt">'+title+'</div>'+(sub?'<div class="ps">'+sub+'</div>':'')+'</div><button class="chip" data-a="close" aria-label="Close">'+XICON+'</button></div>';
}
function days(){
  const a=[],n=new Date();
  for(let i=1;i<=7;i++){
    const d=new Date(n.getFullYear(),n.getMonth(),n.getDate()+i);
    a.push({w:d.toLocaleDateString("en-US",{weekday:"short"}),n:d.getDate(),full:d.toLocaleDateString("en-US",{weekday:"long",day:"numeric",month:"long"})});
  }
  return a;
}
function cartHTML(){
  const c=cartCount(),total=cart.reduce((s,i)=>s+i.q*i.p,0);
  let h=head("Cart",c?c+(c>1?" items":" item"):"");
  if(!cart.length){
    return h+'<p class="empty">Your cart is empty.<br>Pick a garment and tap + on the buy card.</p>';
  }
  h+='<div class="list">'+cart.map((i,k)=>
    '<div class="row"><div class="th"><div class="gi" style="background-position:'+i.g[0]+'% '+i.g[1]+'%"></div></div>'+
    '<div class="rm"><b>'+esc(i.n)+'</b><span>'+esc(i.size)+' · '+esc(i.color)+'</span>'+
    '<div class="qt"><button class="q" data-a="dec" data-k="'+k+'" aria-label="Less">−</button><em>'+i.q+'</em><button class="q" data-a="inc" data-k="'+k+'" aria-label="More">+</button></div></div>'+
    '<div class="rp">$'+(i.p*i.q)+'</div></div>'
  ).join("")+'</div>';
  h+='<div class="tot"><span>Total</span><b>$'+total+'</b></div><button class="pbtn" data-a="order">Order on WhatsApp</button>';
  return h;
}
function calHTML(){
  const ds=days();
  return head("Book a fitting","Pick a day and time")+
    '<div class="lab2">Day</div><div class="drow">'+ds.map((d,k)=>'<button class="dch'+(k===book.d?' on':'')+'" data-a="day" data-k="'+k+'"><span>'+d.w+'</span><b>'+d.n+'</b></button>').join("")+'</div>'+
    '<div class="lab2">Time</div><div class="trow">'+TIMES.map(t=>'<button class="tch'+(t===book.t?' on':'')+'" data-a="time" data-t="'+t+'">'+t+'</button>').join("")+'</div>'+
    '<button class="pbtn" data-a="book">Confirm on WhatsApp</button>';
}
function meHTML(){
  const ini=profile.name?esc(profile.name.charAt(0).toUpperCase()):USER;
  return head("Profile",profile.name?"Hi, "+esc(profile.name):"Welcome")+
    '<div class="avatar">'+ini+'</div>'+
    '<input id="pName" type="text" placeholder="Your name" maxlength="40" autocomplete="off">'+
    '<input id="pPhone" type="tel" placeholder="Phone / WhatsApp" maxlength="20" autocomplete="off">'+
    '<div class="lab2">Preferred size</div><div class="chips">'+["S","M","L","XL"].map(s=>'<button class="chip'+(s===profile.size?' on':'')+'" data-a="psize" data-s="'+s+'">'+s+'</button>').join("")+'</div>'+
    '<button class="pbtn" data-a="save">Save</button><div class="ps ok" id="pOk"></div>';
}
function renderPanel(){
  panel.innerHTML=openName==="cart"?cartHTML():openName==="cal"?calHTML():openName==="me"?meHTML():"";
  if(openName==="me"){$("pName").value=profile.name;$("pPhone").value=profile.phone}
}
function setRailActive(p){railBtns.forEach(b=>b.classList.toggle("on",b.dataset.p===(p||"tops")))}
function openPanel(p){openName=p;renderPanel();panel.scrollTop=0;panel.classList.add("open");setRailActive(p)}
function closePanel(){openName=null;panel.classList.remove("open");setRailActive(null)}

railEl.addEventListener("click",e=>{
  const b=e.target.closest("button");
  if(!b)return;
  const p=b.dataset.p;
  if(p==="tops"||p===openName){closePanel();return}
  openPanel(p);
});

panel.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");
  if(!b)return;
  const a=b.dataset.a,k=+b.dataset.k;
  if(a==="close"){closePanel();return}
  if(a==="inc"||a==="dec"){
    const i=cart[k];if(!i)return;
    i.q+=a==="inc"?1:-1;
    if(i.q<1)cart.splice(k,1);
    persist();updateBadge(false);renderPanel();return;
  }
  if(a==="order"){
    let m="Hi! I'd like to order from VirtualFit:\n";
    cart.forEach(i=>{m+="- "+i.q+"x "+i.n+" ("+i.size+", "+i.color+") - $"+(i.q*i.p)+"\n"});
    m+="Total: $"+cart.reduce((s,i)=>s+i.q*i.p,0);
    if(profile.name)m+="\nName: "+profile.name;
    if(profile.phone)m+="\nPhone: "+profile.phone;
    openWA(m);return;
  }
  if(a==="day"){book.d=k;renderPanel();return}
  if(a==="time"){book.t=b.dataset.t;renderPanel();return}
  if(a==="book"){
    let m="Hi! I'd like to book a fitting at VirtualFit on "+days()[book.d].full+" at "+book.t+".";
    if(profile.name)m+="\nName: "+profile.name;
    openWA(m);return;
  }
  if(a==="psize"){
    readProfileInputs();profile.size=b.dataset.s;applyProfileSize();persist();renderPanel();return;
  }
  if(a==="save"){
    readProfileInputs();persist();renderPanel();
    const ok=$("pOk");if(ok)ok.textContent="Saved ✓";
    return;
  }
});

let addTimer=0;
$("add").addEventListener("click",()=>{
  const it=ITEMS[shown<0?0:shown];
  const size=$("chips").querySelector(".chip.on").textContent;
  const color=it.c[selColor][0];
  const f=cart.find(i=>i.n===it.n&&i.size===size&&i.color===color);
  if(f)f.q++;else cart.push({n:it.n,p:it.p,size:size,color:color,q:1,g:it.g});
  persist();updateBadge(true);
  if(openName==="cart")renderPanel();
  const btn=$("add");
  btn.innerHTML=CHECK;
  clearTimeout(addTimer);
  addTimer=setTimeout(()=>{btn.innerHTML=PLUS},900);
});

/* ---------- try-on scan ---------- */
let running=[];
function tryOn(idx){
  const it=ITEMS[idx];
  setBuy(idx,shown!==-1&&shownOnce);
  shownOnce=true;
  running.forEach(a=>a.cancel());running=[];
  const pos=it.m+"% 100%";
  mNext.style.backgroundPosition=pos;
  grid.style.webkitMaskPosition=pos;grid.style.maskPosition=pos;
  if(reduced){
    mCur.style.backgroundPosition=pos;mCur.style.opacity=1;
    return;
  }
  const D=950,E="cubic-bezier(.65,0,.35,1)";
  const clip=mNext.animate([{clipPath:"inset(0 0 100% 0)"},{clipPath:"inset(0 0 0% 0)"}],{duration:D,easing:E,fill:"forwards"});
  const g=grid.animate([
    {clipPath:"inset(0 0 100% 0)",offset:0},
    {clipPath:"inset(0 0 0 0)",offset:.5},
    {clipPath:"inset(100% 0 0 0)",offset:1}
  ],{duration:1092,easing:E,fill:"forwards"});
  const sc=scan.animate([
    {top:"0%",transform:"scaleX(.2)",opacity:0,offset:0},
    {top:"6%",transform:"scaleX(1)",opacity:1,offset:.08},
    {top:"94%",transform:"scaleX(1)",opacity:1,offset:.92},
    {top:"100%",transform:"scaleX(.2)",opacity:0,offset:1}
  ],{duration:D,easing:E,fill:"forwards"});
  const st=mNext.animate([{transform:"scale(1.012)"},{transform:"scale(1)"}],{duration:1250,easing:"ease-out",fill:"forwards"});
  running=[clip,g,sc,st];
  clip.onfinish=()=>{
    mCur.style.backgroundPosition=pos;mCur.style.opacity=1;
    running.forEach(a=>a.cancel());running=[];
  };
}

/* ---------- state ---------- */
let pos=0,target=0,intro=reduced?1:0,ie=reduced?1:0;
let shown=-1,shownOnce=false;
let dragging=false,down=null;
let px=0,py=0,sx=0,sy=0;
let t=0;

function frame(ts){
  t=ts/1000;
  sx+=(px-sx)*.06;sy+=(py-sy)*.06;
  if(!dragging)pos+=(target-pos)*(reduced?1:.11);
  if(!reduced){intro=Math.min(1,intro+.012);}
  ie=1-Math.pow(1-intro,3);

  for(let i=0;i<N;i++){
    const u=mod(i-pos+5,10)-5,a=Math.abs(u),sg=Math.sign(u);
    let s,z,op=1,ry,blur=0;
    const x=sg*xAt(a)*ie;
    if(a<1){
      s=.55+.45*a;z=-260*(1-a);op=a;ry=-sg*16*a;
    }else{
      s=1/(1+.3*Math.pow(a-1,1.15));z=-110*(a-1);
      ry=-sg*(16+9*Math.min(2,a-1));
      blur=Math.max(0,a-1.6)*2.4;
    }
    if(a>3.4)op=Math.max(0,Math.min(1,1-(a-3.4)/.8));
    const bob=reduced?0:Math.sin(t*1.1+cards[i].seed)*H*.006*Math.min(1,a);
    const y=bob-(1-s)*H*.04;
    ry+=sx*10;
    const o=op*ie,el=cards[i].el;
    el.style.opacity=o;
    el.style.visibility=o<.01?"hidden":"visible";
    el.style.zIndex=a<1?1:Math.round(100-10*a);
    el.style.filter=blur>.05?"blur("+blur.toFixed(2)+"px)":"";
    el.style.transform="translate("+x.toFixed(2)+"px,"+y.toFixed(2)+"px) perspective(1300px) translateZ("+z.toFixed(2)+"px) rotateY("+ry.toFixed(2)+"deg) rotateX("+(-sy*6).toFixed(2)+"deg) scale("+(s*(.6+.4*ie)).toFixed(4)+")";
  }

  room.style.transform="translate3d("+(-sx*22)+"px,"+(-sy*14)+"px,0) scale("+(1.08-.03*ie)+")";
  ghost.style.transform="translate(calc(-50% - "+(sx*40)+"px),"+(-sy*16)+"px)";
  ghostLetters.forEach((l,i)=>{
    l.style.transform="translateY("+((1-ie)*(60+30*i))+"px)";
    l.style.opacity=ie;
  });

  if(!dragging&&Math.abs(target-pos)<.02){
    const idx=mod(Math.round(target),5);
    if(idx!==shown){shown=idx;tryOn(idx)}
  }

  // cursor
  cx+=(tx-cx)*.22;cy+=(ty-cy)*.22;
  cur.style.transform="translate3d("+cx.toFixed(1)+"px,"+cy.toFixed(1)+"px,0)";

  requestAnimationFrame(frame);
}

/* ---------- cursor ---------- */
const cur=$("cur");
let tx=-100,ty=-100,cx=-100,cy=-100;
function cursorState(e){
  const tg=e.target;
  let cls="";
  if(tg.closest&&tg.closest("button,a,input"))cls="btn";
  else if(tg.closest&&tg.closest(".card"))cls=dragging?"drag":"try";
  else if(dragging||(tg.closest&&tg.closest(".stage")))cls="drag";
  cur.classList.toggle("btn",cls==="btn");
  cur.classList.toggle("try",cls==="try");
  cur.classList.toggle("drag",cls==="drag");
}

addEventListener("pointermove",e=>{
  tx=e.clientX;ty=e.clientY;
  if(!cur.classList.contains("show")){cx=tx;cy=ty;cur.classList.add("show")}
  px=e.clientX/W-.5;py=e.clientY/H-.5;
  if(down&&e.pointerId===down.id){
    const dx=e.clientX-down.x;
    if(Math.abs(dx)>=6)down.moved=true;
    if(down.moved){
      dragging=true;
      pos=down.p0-dx/(XS()[1]*W);
      const now=performance.now(),dt=Math.max(1,now-down.lt);
      const inst=(e.clientX-down.lx)/dt;
      down.v=down.v*.7+inst*.3;
      down.lx=e.clientX;down.lt=now;
    }
  }
  cursorState(e);
});
addEventListener("pointerdown",e=>{
  cur.classList.add("down");
  if(!e.target.closest(".stage"))return;
  down={id:e.pointerId,x:e.clientX,p0:pos,moved:false,v:0,lx:e.clientX,lt:performance.now(),card:e.target.closest(".card")};
  cursorState(e);
});
function release(e){
  cur.classList.remove("down");
  if(!down||e.pointerId!==down.id)return;
  const d=down;down=null;
  if(d.moved){
    const idle=performance.now()-d.lt;
    let flick=idle>80?0:d.v;
    flick=Math.max(-1.8,Math.min(1.8,flick));
    target=Math.round(pos-flick*3.2);
    dragging=false;
  }else{
    dragging=false;
    if(d.card){
      const i=+d.card.dataset.i;
      const u=mod(i-pos+5,10)-5;
      target=Math.round(pos+u);
    }
  }
  cursorState(e);
}
addEventListener("pointerup",release);
addEventListener("pointercancel",release);
document.addEventListener("pointerleave",()=>cur.classList.remove("show"));
document.addEventListener("pointerenter",()=>cur.classList.add("show"));

/* wheel */
let wAcc=0,wLast=0;
addEventListener("wheel",e=>{
  if(e.target.closest&&e.target.closest(".panel"))return;
  const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
  wAcc+=d;
  const now=performance.now();
  if(Math.abs(wAcc)>60&&now-wLast>260){
    target+=wAcc>0?1:-1;
    wAcc=0;wLast=now;
  }
},{passive:true});

/* keys + buttons */
addEventListener("keydown",e=>{
  if(e.key==="Escape"){closePanel();return}
  if(e.target&&e.target.matches&&e.target.matches("input,textarea"))return;
  if(e.key==="ArrowRight")target+=1;
  else if(e.key==="ArrowLeft")target-=1;
});
$("next").addEventListener("click",()=>{target+=1});
$("prev").addEventListener("click",()=>{target-=1});

addEventListener("resize",sizeUp);

applyProfileSize();
updateBadge(false);
setBuy(0,false);
sizeUp();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>placePill(false));
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
